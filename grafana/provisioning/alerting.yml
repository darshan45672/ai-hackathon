apiVersion: 1

# List of contact points
contactPoints:
  - orgId: 1
    name: grafana-default-email
    receivers:
      - uid: default-email
        type: email
        settings:
          addresses: admin@ai-hackathon.local
          subject: "Grafana Alert: {{ .GroupLabels.alertname }}"

# List of alert rules
groups:
  - name: ai-hackathon-alerts
    folder: alerts
    interval: 30s
    rules:
      # High CPU usage alert
      - uid: high-cpu-usage
        title: High CPU Usage
        condition: A
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'nodejs_heap_size_used_bytes / nodejs_heap_size_total_bytes * 100 > 80'
              refId: A
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        annotations:
          summary: High memory usage detected
          description: "Node.js application memory usage is above 80%"
        labels:
          severity: warning
          service: backend

      # High memory usage alert  
      - uid: high-memory-usage
        title: High Memory Usage
        condition: A
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'nodejs_heap_size_used_bytes > 500000000'
              refId: A
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        annotations:
          summary: High memory usage detected
          description: "Node.js application memory usage is above 500MB"
        labels:
          severity: warning
          service: backend

      # Service down alert
      - uid: service-down
        title: Service Down
        condition: A
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'app_health_status == 0'
              refId: A
        noDataState: Alerting
        execErrState: Alerting
        for: 1m
        annotations:
          summary: Service is unhealthy
          description: "Application health check is failing"
        labels:
          severity: critical
          service: backend

      # High error rate alert
      - uid: high-error-rate
        title: High Error Rate
        condition: A
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'app_error_total > 10'
              refId: A
        noDataState: NoData
        execErrState: Alerting
        for: 2m
        annotations:
          summary: High error rate detected
          description: "Application error count is above 10"
        labels:
          severity: warning
          service: backend

      # Database connection issues
      - uid: database-connections
        title: Database Connection Issues
        condition: A
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'database_connection_status == 0'
              refId: A
        noDataState: NoData
        execErrState: Alerting
        for: 3m
        annotations:
          summary: Database connection failed
          description: "Database connection health check is failing"
        labels:
          severity: critical
          service: database
